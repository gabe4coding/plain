# Rules of the deterministic risk classifier (.github/scripts/risk_tier.py).
# The `risk` workflow reads this file from the BASE branch: a PR cannot loosen its own rules.
# Any change to this file is T2-hard. Globs: `*` stays in one folder, `**` crosses folders,
# a pattern without `/` matches the name in any folder.
version: 1
repo: gabe4coding/plain

# T0 candidates. A PR whose files are all docs or tests (and that removes no assertion) is T0.
docs: ["*.md", "*.mdx", "*.txt", "docs/**", "**/assets/**", "*.svg", "*.png", "*.jpg", "*.gif", "*.webp"]
# Markdown that a model or an agent reads is product text, not docs: T1 at least.
not_docs: ["AGENTS.md", "CLAUDE.md", "CODING_STANDARDS.md", "**/CLAUDE.md", "**/AGENTS.md", ".claude/**", ".agents/**", ".codex/**", "plugins/**", "mods/**", "scripts/**", "examples/**"]
tests: ["tests/**", "**/*.test.ts", "**/*.test.mjs", "e2e/**", ".github/scripts/test_*.py"]
# scripts/gates.test.mjs holds the gate floors: it is a gate, not a test.
not_tests: ["scripts/gates.test.mjs"]
# Excluded from the size limits (lockfiles always are).
generated: ["plugins/**", "dist/**"]

# T2-hard: nothing lowers it.
hard:
  - .github/risk.yml
  - .github/scripts/risk_tier.py
  - .github/scripts/general_review.py
  - .github/workflows/review.yml
  - .github/workflows/risk.yml
  # Reviewer config can silence or retarget the hosted reviewer.
  - greptile.json
  - .greptile/**
  - .coderabbit.yaml
  - .coderabbit.yml
  - "**/publish*.yml"
  - "**/release*.yml"
  - "**/tag*.yml"
  - CODEOWNERS
  - .github/CODEOWNERS
  - docs/CODEOWNERS
  - "**/ruleset*"
  - LICENSE
  - LICENSE.*
  - .gitleaks.toml
  - ".githooks/**"
# T2-soft: Gabe, unless the LLM layer (not active yet) shows the change only tightens.
# CLI flags and env loading, the Jev key and model pin, the gate floors and source rules, the agent PR gate, and the public GitHub Action.
soft: ["bin/**", "src/cli.ts", "src/computer/cli.ts", "src/mobile/cli.ts", "src/suite/native-cli.ts", "src/suite/options.ts", "src/core/env.ts", "src/jev/provider.ts", "scripts/gates.test.mjs", "scripts/source-rules/**", "scripts/pr-gate.mjs", "scripts/validation-stamp.mjs", ".claude/settings.json", ".codex/hooks.json", "action.yml"]
# T2-soft as well: a changed line in these files that matches the pattern (secret, mask, redact, env code).
soft_content:
  - paths: ["src/**"]
    pattern: "secret|redact|mask|password|process\\.env|api[_-]?key"
plugin_manifests: []
publish_on_version: ["package.json"]   # merging a version change publishes to npm and tags v<version>
dependency_manifests:
  npm: ["package.json"]
  python: []
limits:
  net_deleted_lines: 1000
  changed_code_lines: 1500
  changed_code_files: 40
history_rewrite_text: "force[- ]?push|push --force|rewrite (the )?(git )?history|history rewrite|filter-(branch|repo)"

hold:
  # Never install the plugins of these vendors: a path or an added line that names one goes to HOLD.
  # sha256 of the lowercase name, so this public repo does not spell it (risk_tier.name_hashes).
  forbidden_names_sha256:
    - de61d34d2cf76f1208bb2cfd0b417d7e6827c66ff5ffbaa765d31c8a92f5cf41
    - 219edac479105ee0f6e4b0323ed589d2523d1204767d11797b052eaf1fdb05cb
  forbidden_text: []   # optional regexes, for text that is not a secret
  # Comment-pruning PRs are on hold.
  comment_pruning:
    title_or_branch: "(prune|pruning|strip|remove|drop|trim|delete)[-_ a-z]{0,20}comments|comments?[-_ ]?(prune|pruning|cleanup|removal)"
    min_removed_lines: 20
    comment_share: 0.7

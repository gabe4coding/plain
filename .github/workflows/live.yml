name: Live

# Real Jev picks and judgments, against the local site in e2e/ and saved pages: no remote site in the loop.
# The ruleset on main requires the `live` check, so the workflow runs on every pull request and always reports;
# the "Check what changed" step skips the slow checks when no file matched by RUNTIME changed.
# schedule runs on the default branch only. Any event that is not a pull request always runs the checks.
on:  # yamllint disable-line rule:truthy
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      # Jev debug dumps go to $TMPDIR/plain; pin TMPDIR so the upload step finds them.
      TMPDIR: /tmp
      # A pull request from a fork gets no secrets: skip there, fail everywhere else.
      FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository && github.event_name == 'pull_request' }}
      # The files that can change a live result: the runtime, the e2e suite and the eval data.
      RUNTIME: '^(src/|bin/|e2e/|scripts/claim-states/|scripts/read-states/|tsconfig\.json$|package-lock\.json$|scripts/e2e\.mjs$|scripts/benchmark-claims\.mjs$|scripts/claim-cases\.json$|\.github/workflows/live\.yml$)'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check what changed
        id: changes
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then echo "runtime=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE...$HEAD" | grep -Eq "$RUNTIME"; then echo "runtime=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo 'No runtime, e2e or eval data change: live checks skipped.'
      - name: Check the Jev key
        id: key
        if: steps.changes.outputs.runtime == 'true'
        shell: bash
        run: |
          if [[ -n "$TYPESAFE_API_KEY" ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "$FORK" == 'true' ]]; then echo '::warning::No TYPESAFE_API_KEY on a fork pull request: live checks skipped.'; exit 0; fi
          echo '::error::Set the TYPESAFE_API_KEY repository secret: the live checks need it.' >&2
          exit 1
      - uses: actions/setup-node@v4
        if: steps.key.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
      - if: steps.key.outputs.run == 'true'
        run: npm ci
      - if: steps.key.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.key.outputs.run == 'true'
        run: npm run build
      - name: E2E on the local site (CLI and MCP)
        if: steps.key.outputs.run == 'true'
        run: node scripts/e2e.mjs
      - name: Claims eval (false passes must stay 0)
        if: steps.key.outputs.run == 'true'
        run: node scripts/benchmark-claims.mjs --gate
      - name: Keep the Jev debug dumps
        if: failure() && steps.key.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jev-dumps
          path: /tmp/plain/
          if-no-files-found: ignore
